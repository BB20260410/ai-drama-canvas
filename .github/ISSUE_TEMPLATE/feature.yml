name: 功能建议
description: 描述要解决的问题，而不只给方案
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案（可选）
  - type: textarea
    id: non_goals
    attributes:
      label: 明确不做什么
      description: 例如不要重建已关账的 P0–P14 owner，不要引入 AGPL 源码。
