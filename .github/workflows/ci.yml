name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install
        run: npm ci
      - name: Rebuild Electron binary
        run: node node_modules/electron/install.js
      - name: Build MCP
        run: npm run build:mcp
      - name: Typecheck
        run: npm run typecheck:app
      - name: Fast tests
        run: npm test
